[project]
name = "licor"
version = "0.1.0"
description = "Offline lift-and-coast telemetry analysis for Le Mans Ultimate."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.2",
    "plotly>=6.7.0",
    "polars>=1.40.1",
    "pydantic>=2.13.4",
    "scipy>=1.17.1",
    "streamlit>=1.57.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/licor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
